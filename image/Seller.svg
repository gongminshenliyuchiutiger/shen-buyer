<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 背景圈 -->
  <circle cx="50" cy="50" r="46" fill="#fbbf24" stroke="#1e293b" stroke-width="4"/>
  
  <!-- 拍賣官身體 (穿紅色西裝、白色襯衫、黑色領結) -->
  <path d="M 20 95 C 20 70, 80 70, 80 95" fill="#ef4444" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 42 75 L 50 90 L 58 75 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <path d="M 44 76 L 50 82 L 56 76" fill="#1e293b"/> <!-- 領結 -->
  
  <!-- 脖子 -->
  <rect x="44" y="66" width="12" height="12" fill="#ffedd5" stroke="#1e293b" stroke-width="4"/>
  
  <!-- 頭部 -->
  <circle cx="50" cy="46" r="22" fill="#ffedd5" stroke="#1e293b" stroke-width="4"/>
  
  <!-- 眼睛 (戴著單片眼鏡，很有紳士拍賣官的感覺) -->
  <circle cx="42" cy="44" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <circle cx="42" cy="44" r="1.5" fill="#1e293b"/>
  <!-- 右眼帶單片眼鏡 -->
  <circle cx="58" cy="44" r="7" fill="rgba(59, 130, 246, 0.2)" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="58" cy="44" r="2.5" fill="#1e293b"/>
  <path d="M 65 44 L 74 56" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/> <!-- 眼鏡鏈 -->

  <!-- 帥氣的八字鬍 -->
  <path d="M 38 56 Q 50 50 62 56 Q 50 62 38 56 Z" fill="#1e293b" stroke="#1e293b" stroke-width="1"/>
  
  <!-- 拍賣官高禮帽 (極具標誌性) -->
  <path d="M 22 28 C 30 28, 70 28, 78 28 C 82 28, 82 32, 78 32 C 70 32, 30 32, 22 32 C 18 32, 18 28, 22 28 Z" fill="#1e293b" stroke="#1e293b" stroke-width="3"/>
  <rect x="32" y="4" width="36" height="24" fill="#1e293b" stroke="#1e293b" stroke-width="4" rx="2" ry="2"/>
  <rect x="32" y="20" width="36" height="4" fill="#ef4444"/> <!-- 禮帽紅帶 -->
</svg>
